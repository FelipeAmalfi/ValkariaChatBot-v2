services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: valkaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/valkaria-neo4j-pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "valkaria-neo4j-pass", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/valkaria
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  chat-service:
    build:
      context: ../..
      dockerfile: services/chat-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/valkaria
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      neo4j:    { condition: service_healthy }

  world-service:
    build:
      context: ../..
      dockerfile: services/world-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/valkaria
      - NEO4J_URI=bolt://neo4j:7687
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      neo4j:    { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:80
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:80/graphql

  gateway:
    build:
      context: ../../gateway
    ports:
      - "80:80"
    depends_on:
      auth-service:  { condition: service_healthy }
      chat-service:  { condition: service_started }
      world-service: { condition: service_started }
      web:           { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
